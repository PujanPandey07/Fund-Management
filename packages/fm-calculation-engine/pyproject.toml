[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disaster-fund-calculation-engine"
version = "0.1.1"
description = "Disaster Reconstruction & Relief Fund Calculation Engine: Multi-Tranche Liabilities, Donation Offsets, and District Pooling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Pujan Pandey", email = "arghakhanchipujan@gmail.com" }]
keywords = ["disaster-relief", "fund-management", "reconstruction", "nepal", "grants", "calculation-engine", "tranches"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Development Status :: 3 - Alpha",
]

dependencies = [
    "disaster-fund-plan>=0.1.1",
    "pydantic>=2",
]

[tool.setuptools.packages.find]
where = ["src"]


[project.urls]
Repository = "https://github.com/arghakhanchipujan/Fund-Management"
